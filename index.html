<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8c8d4">
<title>Quangda14 Okela</title>

<style>
:root{
  --pink:#f8c8d4;
  --pink2:#ffe4eb;
  --pink3:#fff3f6;
  --deep:#d95d7b;
  --text:#49343b;
  --muted:#92737d;
  --white:#fff;
  --shadow:0 8px 25px rgba(180,80,110,.12);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(180deg,#fff5f7,#ffecef);
  color:var(--text);
  min-height:100vh;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,245,247,.94);
  backdrop-filter:blur(12px);
  padding:16px;
  border-bottom:1px solid #f5d5dd;
}

.header-inner{
  max-width:900px;
  margin:auto;
}

.logo{
  font-size:25px;
  font-weight:800;
  color:var(--deep);
  margin-bottom:12px;
}

.search{
  width:100%;
  padding:13px 16px;
  border:2px solid #f4d4dc;
  border-radius:16px;
  outline:none;
  background:white;
  color:var(--text);
}

.search:focus{
  border-color:var(--pink);
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 16px 100px;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.count{
  color:var(--muted);
  font-size:14px;
}

.primary-btn{
  background:var(--deep);
  color:white;
  padding:12px 17px;
  border-radius:15px;
  font-weight:700;
  box-shadow:var(--shadow);
}

.primary-btn:active{
  transform:scale(.97);
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:50px;
  margin-bottom:12px;
}

.notes{
  display:grid;
  gap:15px;
}

.note{
  background:white;
  border:1px solid #f5d8df;
  border-radius:20px;
  padding:17px;
  box-shadow:var(--shadow);
}

.note-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:8px;
  word-break:break-word;
}

.note-content{
  white-space:pre-wrap;
  line-height:1.55;
  color:#634c54;
  word-break:break-word;
}

.note-date{
  color:var(--muted);
  font-size:12px;
  margin-top:12px;
}

.note-images{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:13px;
}

.note-images img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
  background:#ffeef2;
}

.note-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.small-btn{
  padding:9px 13px;
  border-radius:12px;
  background:#ffe8ee;
  color:#b94e69;
  font-weight:700;
}

.delete-btn{
  background:#fff0f2;
  color:#c44f5d;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(65,35,43,.4);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(650px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff9fa;
  border-radius:24px;
  padding:20px;
  box-shadow:0 20px 60px rgba(80,30,45,.2);
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.modal-head h2{
  color:var(--deep);
}

.close-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#ffe5eb;
  color:#a84962;
  font-size:20px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-weight:700;
}

.field input,
.field textarea{
  width:100%;
  border:2px solid #f2d6dd;
  border-radius:14px;
  padding:13px;
  outline:none;
  background:white;
  color:var(--text);
}

.field input:focus,
.field textarea:focus{
  border-color:var(--pink);
}

.field textarea{
  min-height:170px;
  resize:vertical;
}

.add-image-btn{
  width:100%;
  padding:13px;
  border-radius:14px;
  background:#ffe3ea;
  color:#b64d68;
  font-weight:800;
}

.image-preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.preview-item{
  position:relative;
}

.preview-item img{
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:12px;
}

.remove-image{
  position:absolute;
  top:5px;
  right:5px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#c44f5d;
  font-weight:bold;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:14px;
  font-weight:800;
}

.cancel-btn{
  background:#f5e7ea;
  color:#765963;
}

.save-btn{
  background:var(--deep);
  color:white;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:200;
  transform:translateX(-50%) translateY(20px);
  background:#49343b;
  color:white;
  padding:12px 17px;
  border-radius:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:520px){

  .logo{
    font-size:22px;
  }

  .top-actions{
    align-items:stretch;
  }

  .primary-btn{
    padding:10px 13px;
  }

  .note-images,
  .image-preview{
    grid-template-columns:repeat(2,1fr);
  }

  .modal-box{
    padding:16px;
    border-radius:20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="logo">
      🌸 Quangda14 Okela
    </div>

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="🔎 Tìm kiếm ghi chú..."
      autocomplete="off"
    >

  </div>
</header>


<main class="container">

  <div class="top-actions">

    <div id="count" class="count">
      0 ghi chú
    </div>

    <button
      id="newNoteBtn"
      class="primary-btn"
      type="button"
    >
      ＋ Ghi chú mới
    </button>

  </div>

  <section id="notes" class="notes"></section>

  <div id="empty" class="empty">

    <div class="empty-icon">
      📝
    </div>

    <div>
      Chưa có ghi chú nào.
    </div>

  </div>

</main>


<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Ghi chú mới
      </h2>

      <button
        id="closeModalBtn"
        class="close-btn"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="field">

      <label for="titleInput">
        Tiêu đề
      </label>

      <input
        id="titleInput"
        type="text"
        placeholder="Ví dụ: Ý tưởng website"
        maxlength="200"
      >

    </div>


    <div class="field">

      <label for="contentInput">
        Nội dung
      </label>

      <textarea
        id="contentInput"
        placeholder="Viết gì đó ở đây..."
      ></textarea>

    </div>


    <div class="field">

      <label>
        Hình ảnh
      </label>

      <button
        id="addImageBtn"
        class="add-image-btn"
        type="button"
      >
        📷 ＋ Thêm ảnh
      </button>

      <input
        id="imageInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
        hidden
      >

      <div
        id="imagePreview"
        class="image-preview"
      ></div>

    </div>


    <div class="modal-actions">

      <button
        id="cancelBtn"
        class="cancel-btn"
        type="button"
      >
        Hủy
      </button>

      <button
        id="saveBtn"
        class="save-btn"
        type="button"
      >
        💾 Lưu ghi chú
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>
"use strict";


const STORAGE_KEY =
  "quangda14okela_notes_v2";


let notes = [];
let editingId = null;
let currentImages = [];


const searchInput =
  document.getElementById("searchInput");

const newNoteBtn =
  document.getElementById("newNoteBtn");

const notesContainer =
  document.getElementById("notes");

const emptyState =
  document.getElementById("empty");

const countElement =
  document.getElementById("count");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const titleInput =
  document.getElementById("titleInput");

const contentInput =
  document.getElementById("contentInput");

const addImageBtn =
  document.getElementById("addImageBtn");

const imageInput =
  document.getElementById("imageInput");

const imagePreview =
  document.getElementById("imagePreview");

const closeModalBtn =
  document.getElementById("closeModalBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const saveBtn =
  document.getElementById("saveBtn");

const toast =
  document.getElementById("toast");


function uid(){

  return Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2);
}


function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(() => {

      toast.classList.remove("show");

    },2200);
}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatDate(date){

  try{

    return new Date(date)
      .toLocaleString(
        "vi-VN",
        {
          dateStyle:"short",
          timeStyle:"short"
        }
      );

  }catch{

    return "";
  }
}


function loadNotes(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!saved){

      notes = [];
      return;
    }

    const parsed =
      JSON.parse(saved);

    notes =
      Array.isArray(parsed)
        ? parsed
        : [];

  }catch(error){

    console.error(error);

    notes = [];

    showToast(
      "Không đọc được dữ liệu."
    );
  }
}


function saveNotes(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(notes)
    );

    return true;

  }catch(error){

    console.error(error);

    showToast(
      "Bộ nhớ trình duyệt đã đầy."
    );

    return false;
  }
}


function getFilteredNotes(){

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();

  if(!keyword){

    return notes;
  }

  return notes.filter(note => {

    const title =
      String(note.title || "")
        .toLowerCase();

    const content =
      String(note.content || "")
        .toLowerCase();

    return (
      title.includes(keyword) ||
      content.includes(keyword)
    );
  });
}


function renderNotes(){

  const filtered =
    getFilteredNotes();

  notesContainer.innerHTML = "";

  countElement.textContent =
    `${filtered.length} ghi chú`;


  if(filtered.length === 0){

    emptyState.style.display =
      "block";


    if(searchInput.value.trim()){

      emptyState.innerHTML = `
        <div class="empty-icon">
          🔎
        </div>

        <div>
          Không tìm thấy ghi chú phù hợp.
        </div>
      `;

    }else{

      emptyState.innerHTML = `
        <div class="empty-icon">
          📝
        </div>

        <div>
          Chưa có ghi chú nào.
        </div>
      `;
    }

    return;
  }


  emptyState.style.display =
    "none";


  filtered.forEach(note => {

    const article =
      document.createElement("article");

    article.className =
      "note";


    const title =
      escapeHTML(
        note.title ||
        "Không có tiêu đề"
      );


    const content =
      escapeHTML(
        note.content || ""
      );


    let imagesHTML = "";


    if(
      Array.isArray(note.images) &&
      note.images.length
    ){

      imagesHTML = `
        <div class="note-images">

          ${note.images.map(image => `

            <img
              src="${image.data}"
              alt="${escapeHTML(
                image.name || "Ảnh"
              )}"
              loading="lazy"
            >

          `).join("")}

        </div>
      `;
    }


    article.innerHTML = `

      <div class="note-title">
        ${title}
      </div>

      ${
        content
          ? `
            <div class="note-content">
              ${content}
            </div>
          `
          : ""
      }

      ${imagesHTML}

      <div class="note-date">
        ${formatDate(
          note.updatedAt ||
          note.createdAt
        )}
      </div>

      <div class="note-actions">

        <button
          class="small-btn edit-btn"
          type="button"
          data-id="${note.id}"
        >
          ✏️ Sửa
        </button>

        <button
          class="small-btn delete-btn"
          type="button"
          data-id="${note.id}"
        >
          🗑️ Xóa
        </button>

      </div>
    `;


    notesContainer.appendChild(
      article
    );
  });
}


function openNewNote(){

  editingId = null;

  currentImages = [];

  modalTitle.textContent =
    "Ghi chú mới";

  titleInput.value = "";

  contentInput.value = "";

  imageInput.value = "";

  renderImagePreview();

  modal.classList.add("show");


  setTimeout(() => {

    titleInput.focus();

  },100);
}


function openEditNote(id){

  const note =
    notes.find(
      item => item.id === id
    );

  if(!note){

    return;
  }


  editingId = id;

  currentImages =
    Array.isArray(note.images)
      ? [...note.images]
      : [];


  modalTitle.textContent =
    "Chỉnh sửa ghi chú";

  titleInput.value =
    note.title || "";

  contentInput.value =
    note.content || "";

  imageInput.value = "";

  renderImagePreview();

  modal.classList.add("show");


  setTimeout(() => {

    titleInput.focus();

  },100);
}


function closeModal(){

  modal.classList.remove("show");

  editingId = null;

  currentImages = [];

  imageInput.value = "";

  imagePreview.innerHTML = "";
}


function readImageAsDataURL(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        resolve(
          reader.result
        );
      };


      reader.onerror = () => {

        reject(
          new Error(
            "Không thể đọc ảnh."
          )
        );
      };


      reader.readAsDataURL(file);
    }
  );
}


function renderImagePreview(){

  imagePreview.innerHTML = "";


  currentImages.forEach(image => {

    const item =
      document.createElement("div");

    item.className =
      "preview-item";


    item.innerHTML = `

      <img
        src="${image.data}"
        alt="${escapeHTML(
          image.name || "Ảnh"
        )}"
      >

      <button
        type="button"
        class="remove-image"
        data-id="${image.id}"
      >
        ×
      </button>
    `;


    imagePreview.appendChild(
      item
    );
  });
}


async function handleImages(event){

  const files =
    Array.from(
      event.target.files || []
    );


  if(!files.length){

    return;
  }


  const allowedTypes = [

    "image/jpeg",
    "image/png",
    "image/webp"

  ];


  for(const file of files){

    if(
      !allowedTypes.includes(
        file.type
      )
    ){

      showToast(
        `Không hỗ trợ: ${file.name}`
      );

      continue;
    }


    if(
      file.size >
      10 * 1024 * 1024
    ){

      showToast(
        `Ảnh quá lớn: ${file.name}`
      );

      continue;
    }


    try{

      const data =
        await readImageAsDataURL(
          file
        );


      currentImages.push({

        id:uid(),

        name:file.name,

        type:file.type,

        size:file.size,

        data:data

      });

    }catch(error){

      console.error(error);

      showToast(
        `Không đọc được: ${file.name}`
      );
    }
  }


  renderImagePreview();

  event.target.value = "";
}


function saveCurrentNote(){

  const title =
    titleInput.value.trim();

  const content =
    contentInput.value.trim();


  if(
    !title &&
    !content &&
    !currentImages.length
  ){

    showToast(
      "Hãy nhập nội dung hoặc thêm ảnh."
    );

    return;
  }


  const now =
    new Date().toISOString();


  if(editingId){

    const index =
      notes.findIndex(
        note =>
          note.id === editingId
      );


    if(index === -1){

      return;
    }


    notes[index] = {

      ...notes[index],

      title:title,

      content:content,

      images:[
        ...currentImages
      ],

      updatedAt:now

    };


    showToast(
      "Đã cập nhật ghi chú ✨"
    );

  }else{

    notes.unshift({

      id:uid(),

      title:title,

      content:content,

      images:[
        ...currentImages
      ],

      createdAt:now,

      updatedAt:now

    });


    showToast(
      "Đã lưu ghi chú 🌸"
    );
  }


  if(saveNotes()){

    closeModal();

    renderNotes();
  }
}


function deleteNote(id){

  const exists =
    notes.some(
      note => note.id === id
    );


  if(!exists){

    return;
  }


  notes =
    notes.filter(
      note => note.id !== id
    );


  if(saveNotes()){

    renderNotes();

    showToast(
      "Đã xóa ghi chú 🗑️"
    );
  }
}


/* =========================
   EVENTS
========================= */


newNoteBtn.addEventListener(
  "click",
  openNewNote
);


closeModalBtn.addEventListener(
  "click",
  closeModal
);


cancelBtn.addEventListener(
  "click",
  closeModal
);


saveBtn.addEventListener(
  "click",
  saveCurrentNote
);


addImageBtn.addEventListener(
  "click",
  () => {

    imageInput.click();

  }
);


imageInput.addEventListener(
  "change",
  handleImages
);


searchInput.addEventListener(
  "input",
  renderNotes
);


modal.addEventListener(
  "click",
  event => {

    if(
      event.target === modal
    ){

      closeModal();
    }
  }
);


document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      modal.classList.contains("show")
    ){

      closeModal();
    }
  }
);


notesContainer.addEventListener(
  "click",
  event => {

    const editButton =
      event.target.closest(
        ".edit-btn"
      );

    const deleteButton =
      event.target.closest(
        ".delete-btn"
      );


    if(editButton){

      openEditNote(
        editButton.dataset.id
      );

      return;
    }


    if(deleteButton){

      deleteNote(
        deleteButton.dataset.id
      );

    }
  }
);


imagePreview.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".remove-image"
      );


    if(!button){

      return;
    }


    currentImages =
      currentImages.filter(
        image =>
          image.id !==
          button.dataset.id
      );


    renderImagePreview();
  }
);


/* =========================
   START
========================= */

loadNotes();

renderNotes();

</script>

</body>
    </html>
