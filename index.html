<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7c6d0">
  <title>Quangda14 Okela</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink-1: #fff0f3;
      --pink-2: #ffdfe6;
      --pink-3: #f7c6d0;
      --pink-4: #ed9dad;
      --pink-5: #d96f86;
      --pink-6: #bd536c;

      --cream: #fffaf7;
      --text: #573d44;
      --text-light: #8b6d75;
      --white: #ffffff;
      --border: #f2d6dc;

      --shadow: 0 10px 30px rgba(190, 90, 115, 0.12);
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      min-height: 100vh;
      color: var(--text);

      background:
        radial-gradient(
          circle at top left,
          #ffe8ee 0,
          transparent 35%
        ),
        linear-gradient(
          135deg,
          var(--cream),
          var(--pink-1)
        );
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ================= HEADER ================= */

    header {
      position: sticky;
      top: 0;
      z-index: 20;

      background: rgba(255, 250, 247, 0.88);

      border-bottom:
        1px solid rgba(242, 214, 220, 0.8);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      max-width: 1150px;
      margin: auto;
      padding: 18px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-icon {
      width: 46px;
      height: 46px;

      border-radius: 15px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--pink-3),
          var(--pink-4)
        );

      color: white;
      font-size: 23px;

      box-shadow:
        0 8px 20px rgba(217, 111, 134, 0.2);
    }

    .brand h1 {
      font-size: 20px;
      line-height: 1.1;
    }

    .brand p {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 3px;
    }

    .note-count {
      white-space: nowrap;

      padding: 9px 13px;

      border-radius: 999px;

      background: var(--pink-2);
      color: var(--pink-6);

      font-size: 13px;
      font-weight: 700;
    }

    /* ================= MAIN ================= */

    main {
      max-width: 1150px;
      margin: auto;

      padding: 28px 20px 60px;
    }

    .toolbar {
      display: flex;
      gap: 12px;

      margin-bottom: 25px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box span {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      opacity: 0.6;
    }

    .search-box input {
      width: 100%;
      height: 48px;

      padding:
        0 15px 0 43px;

      border:
        1px solid var(--border);

      border-radius: 16px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.8);

      color: var(--text);
    }

    .search-box input:focus {
      border-color: var(--pink-4);

      box-shadow:
        0 0 0 4px
        rgba(237, 157, 173, 0.12);
    }

    .primary-btn {
      border: none;
      border-radius: 16px;

      padding: 0 20px;

      background:
        linear-gradient(
          135deg,
          var(--pink-5),
          var(--pink-4)
        );

      color: white;
      font-weight: 800;

      box-shadow:
        0 8px 20px
        rgba(217, 111, 134, 0.2);

      transition: 0.2s;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
    }

    /* ================= EMPTY ================= */

    .empty {
      text-align: center;

      padding: 70px 20px;

      border:
        1px dashed var(--border);

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.55);
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .empty h2 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .empty p {
      color: var(--text-light);
      font-size: 14px;
    }

    /* ================= NOTES ================= */

    .notes-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(260px, 1fr)
        );

      gap: 18px;
    }

    .note-card {
      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.84);

      border:
        1px solid var(--border);

      border-radius: 22px;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .note-card:hover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 35px
        rgba(190, 90, 115, 0.17);
    }

    .note-image {
      width: 100%;
      height: 190px;

      display: block;

      object-fit: cover;

      background: var(--pink-1);
    }

    .note-image-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 2px;

      background: var(--pink-2);
    }

    .note-image-grid img {
      width: 100%;
      height: 140px;

      display: block;

      object-fit: cover;
    }

    .note-image-grid.single {
      display: block;
    }

    .note-image-grid.single img {
      height: 190px;
    }

    .note-body {
      padding: 17px;
    }

    .note-title {
      font-size: 18px;
      font-weight: 800;

      margin-bottom: 8px;

      word-break: break-word;
    }

    .note-content {
      color: var(--text-light);

      font-size: 14px;
      line-height: 1.55;

      white-space: pre-wrap;

      display: -webkit-box;

      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .note-meta {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-top: 15px;
    }

    .note-date {
      color: var(--text-light);
      font-size: 11px;
    }

    .note-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border:
        1px solid var(--border);

      border-radius: 11px;

      background: white;
      color: var(--text);
    }

    .icon-btn:hover {
      background: var(--pink-1);
    }

    .delete-btn:hover {
      color: #c94e65;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 18px;

      background:
        rgba(65, 35, 42, 0.35);

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(650px, 100%);
      max-height: 92vh;

      overflow-y: auto;

      padding: 23px;

      background: var(--cream);

      border:
        1px solid var(--border);

      border-radius: 25px;

      box-shadow:
        0 25px 80px
        rgba(80, 40, 50, 0.2);
    }

    .modal-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 21px;
    }

    .close-btn {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 12px;

      background: var(--pink-2);
      color: var(--pink-6);

      font-size: 20px;
    }

    /* ================= FORM ================= */

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 800;
    }

    .field input[type="text"],
    .field textarea {
      width: 100%;

      padding: 13px;

      border:
        1px solid var(--border);

      border-radius: 15px;

      outline: none;

      background: white;
      color: var(--text);
    }

    .field input[type="text"]:focus,
    .field textarea:focus {
      border-color: var(--pink-4);

      box-shadow:
        0 0 0 4px
        rgba(237, 157, 173, 0.1);
    }

    .field textarea {
      min-height: 180px;

      resize: vertical;

      line-height: 1.6;
    }

    /* ================= IMAGE UPLOAD ================= */

    .image-upload {
      padding: 16px;

      border:
        1px dashed var(--pink-4);

      border-radius: 18px;

      background: var(--pink-1);
    }

    .add-image-btn {
      width: 100%;
      min-height: 50px;

      border:
        1px solid var(--pink-4);

      border-radius: 15px;

      background: white;

      color: var(--pink-6);

      font-weight: 800;
      font-size: 14px;

      transition: 0.2s;
    }

    .add-image-btn:hover {
      background: #fff7f9;

      transform: translateY(-1px);

      box-shadow:
        0 7px 18px
        rgba(217, 111, 134, 0.1);
    }

    .add-image-btn:active {
      transform: scale(0.98);
    }

    .image-help {
      margin-top: 9px;

      color: var(--text-light);

      font-size: 12px;
      line-height: 1.45;
    }

    .image-preview {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(120px, 1fr)
        );

      gap: 10px;

      margin-top: 13px;
    }

    .preview-item {
      position: relative;

      overflow: hidden;

      border:
        1px solid var(--border);

      border-radius: 15px;

      background: white;
    }

    .preview-item img {
      display: block;

      width: 100%;
      height: 115px;

      object-fit: cover;
    }

    .preview-info {
      padding: 7px;

      font-size: 10px;

      color: var(--text-light);
    }

    .preview-name {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .preview-type {
      margin-top: 2px;

      font-weight: 700;
    }

    .remove-image {
      position: absolute;

      right: 6px;
      top: 6px;

      width: 28px;
      height: 28px;

      border: none;
      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.94);

      color: var(--pink-6);

      font-weight: 900;
    }

    /* ================= FOOTER ================= */

    .modal-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 20px;
    }

    .secondary-btn {
      padding: 11px 17px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background: white;

      color: var(--text);

      font-weight: 700;
    }

    .danger-btn {
      padding: 11px 17px;

      border: none;
      border-radius: 14px;

      background: #d96f86;

      color: white;

      font-weight: 800;
    }

    /* ================= CONFIRM ================= */

    .confirm-box {
      width: min(420px, 100%);
    }

    .confirm-text {
      color: var(--text-light);

      line-height: 1.55;

      font-size: 14px;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      z-index: 300;

      padding: 11px 16px;

      border-radius: 13px;

      background: #573d44;
      color: white;

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, 20px);

      transition: 0.25s;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .header-inner {
        padding: 14px;
      }

      main {
        padding:
          20px 14px 45px;
      }

      .toolbar {
        flex-direction: column;
      }

      .primary-btn {
        height: 48px;
      }

      .notes-grid {
        grid-template-columns: 1fr;
      }

      .modal-box {
        padding: 18px;

        border-radius: 21px;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand-icon {
        width: 41px;
        height: 41px;
      }

      .image-preview {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>

    <div class="header-inner">

      <div class="brand">

        <div class="brand-icon">
          ✿
        </div>

        <div>
          <h1>
            Quangda14 Okela
          </h1>

          <p>
            Ghi chú cá nhân
          </p>
        </div>

      </div>

      <div
        class="note-count"
        id="noteCount"
      >
        0 ghi chú
      </div>

    </div>

  </header>


  <!-- ================= MAIN ================= -->

  <main>

    <div class="toolbar">

      <div class="search-box">

        <span>🔎</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Tìm kiếm ghi chú..."
          autocomplete="off"
        >

      </div>


      <button
        class="primary-btn"
        id="newNoteBtn"
        type="button"
      >
        ＋ Ghi chú mới
      </button>

    </div>


    <section id="notesList"></section>

  </main>


  <!-- ================= EDITOR ================= -->

  <div
    class="modal"
    id="editorModal"
    aria-hidden="true"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="editorTitle">
          Ghi chú mới
        </h2>

        <button
          class="close-btn"
          id="closeEditorBtn"
          type="button"
        >
          ×
        </button>

      </div>


      <!-- TITLE -->

      <div class="field">

        <label for="titleInput">
          Tiêu đề
        </label>

        <input
          id="titleInput"
          type="text"
          maxlength="150"
          placeholder="Nhập tiêu đề..."
        >

      </div>


      <!-- CONTENT -->

      <div class="field">

        <label for="contentInput">
          Nội dung
        </label>

        <textarea
          id="contentInput"
          placeholder="Viết gì đó..."
        ></textarea>

      </div>


      <!-- IMAGE -->

      <div class="field">

        <label>
          Hình ảnh
        </label>

        <div class="image-upload">

          <!-- NÚT THÊM ẢNH -->

          <button
            type="button"
            class="add-image-btn"
            id="addImageBtn"
          >
            📷 ＋ Thêm ảnh
          </button>


          <!-- INPUT FILE ẨN -->

          <input
            id="imageInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
            hidden
          >


          <div class="image-help">
            Hỗ trợ JPG / JPEG, PNG và WebP.
            Có thể chọn nhiều ảnh.
            Tối đa 10MB mỗi ảnh.
          </div>


          <!-- PREVIEW -->

          <div
            class="image-preview"
            id="imagePreview"
          ></div>

        </div>

      </div>


      <!-- FOOTER -->

      <div class="modal-footer">

        <button
          class="secondary-btn"
          id="cancelEditorBtn"
          type="button"
        >
          Hủy
        </button>


        <button
          class="primary-btn"
          id="saveNoteBtn"
          type="button"
        >
          Lưu ghi chú
        </button>

      </div>

    </div>

  </div>


  <!-- ================= DELETE ================= -->

  <div
    class="modal"
    id="confirmModal"
    aria-hidden="true"
  >

    <div class="modal-box confirm-box">

      <div class="modal-header">

        <h2>
          Xóa ghi chú?
        </h2>

        <button
          class="close-btn"
          id="closeConfirmBtn"
          type="button"
        >
          ×
        </button>

      </div>


      <p class="confirm-text">
        Ghi chú này sẽ bị xóa khỏi
        trình duyệt. Hành động này
        không thể hoàn tác.
      </p>


      <div class="modal-footer">

        <button
          class="secondary-btn"
          id="cancelDeleteBtn"
          type="button"
        >
          Hủy
        </button>


        <button
          class="danger-btn"
          id="confirmDeleteBtn"
          type="button"
        >
          Xóa ghi chú
        </button>

      </div>

    </div>

  </div>


  <!-- ================= TOAST ================= -->

  <div
    class="toast"
    id="toast"
  ></div>


  <script>

    /* =====================================================
       QUANGDA14 OKELA
       NOTE SYSTEM
       ===================================================== */

    const STORAGE_KEY =
      "quangda14okela_notes_v3";


    let notes = [];

    let editingId = null;

    let deleteTargetId = null;

    let currentImages = [];


    /* ================= ELEMENTS ================= */

    const notesList =
      document.getElementById(
        "notesList"
      );

    const noteCount =
      document.getElementById(
        "noteCount"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const editorModal =
      document.getElementById(
        "editorModal"
      );

    const confirmModal =
      document.getElementById(
        "confirmModal"
      );

    const titleInput =
      document.getElementById(
        "titleInput"
      );

    const contentInput =
      document.getElementById(
        "contentInput"
      );

    const imageInput =
      document.getElementById(
        "imageInput"
      );

    const imagePreview =
      document.getElementById(
        "imagePreview"
      );

    const editorTitle =
      document.getElementById(
        "editorTitle"
      );

    const toast =
      document.getElementById(
        "toast"
      );


    /* ================= UTILITIES ================= */

    function uid() {

      return (
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .slice(2, 9)
      );
    }


    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(date) {

      return new Intl.DateTimeFormat(
        "vi-VN",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      ).format(
        new Date(date)
      );
    }


    function showToast(message) {

      toast.textContent =
        message;

      toast.classList.add(
        "show"
      );

      clearTimeout(
        showToast.timer
      );

      showToast.timer =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 2200);
    }


    /* ================= STORAGE ================= */

    function loadNotes() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );

        if (!raw) {
          return [];
        }

        const parsed =
          JSON.parse(raw);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch (error) {

        console.error(
          error
        );

        return [];
      }
    }


    function saveNotes() {

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(notes)
        );

        return true;

      } catch (error) {

        console.error(
          error
        );

        showToast(
          "Bộ nhớ trình duyệt đã đầy."
        );

        return false;
      }
    }


    /* ================= SEARCH ================= */

    function getFilteredNotes() {

      const keyword =
        searchInp
