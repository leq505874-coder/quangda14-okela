<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌲 Forest Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cat" class="cat" title="Click vào mèo!">🐱</div>
  <div id="catSpeech" class="cat-speech"></div>

  <header>
    <div class="logo">🌲 Forest Notes</div>
    <nav>
      <button class="nav-btn active" data-cat="all">Tất cả</button>
      <button class="nav-btn" data-cat="dev">💻 Phát triển</button>
      <button class="nav-btn" data-cat="tech">⚙️ Công nghệ</button>
      <button class="nav-btn" data-cat="forest">🤡 How to use the forest</button>
    </nav>
  </header>

  <main>
    <section class="editor">
      <h2>✍️ Tạo ghi chú mới</h2>
      <input type="text" id="title" placeholder="Tiêu đề..." maxlength="100">
      <select id="category">
        <option value="dev">💻 Phát triển</option>
        <option value="tech">⚙️ Công nghệ</option>
        <option value="forest">🤡 How to use the forest</option>
      </select>
      <textarea id="content" placeholder="Nội dung ghi chú..."></textarea>
      <div class="actions">
        <button id="addBtn">➕ Thêm ghi chú</button>
        <button id="clearBtn" class="secondary">🗑️ Xóa tất cả</button>
      </div>
    </section>

    <section class="garden">
      <div class="garden-header">
        <h2>🌳 Khu vườn của bạn</h2>
        <div class="garden-stats">
          <span id="treeCount">0 🌳</span>
          <span id="waterCount">0 💧</span>
        </div>
      </div>
      <div class="garden-actions">
        <button id="plantBtn">🌱 Trồng cây mới</button>
        <button id="waterAllBtn" class="water-btn">💧 Tưới tất cả</button>
        <button id="harvestBtn" class="secondary">✂️ Chặt hết cây lớn</button>
      </div>
      <div id="garden" class="garden-grid"></div>
    </section>

    <section class="notes-section">
      <div class="search-bar">
        <input type="text" id="search" placeholder="🔍 Tìm kiếm ghi chú...">
        <span id="count">0 ghi chú</span>
      </div>
      <div id="notesList" class="notes-grid"></div>
    </section>

    <section class="feedback">
      <h2>📬 Gửi phản hồi</h2>
      <p class="feedback-sub">Bạn nghĩ gì về Forest Notes? Cho mình biết nhé 🤡</p>
      <form id="feedbackForm">
        <input type="text" id="fbName" placeholder="Tên của bạn..." maxlength="50" required>
        <textarea id="fbMessage" placeholder="Nội dung phản hồi..." maxlength="500" required></textarea>
        <div class="fb-row">
          <label class="mood-picker">
            Cảm xúc:
            <select id="fbMood">
              <option value="🤩">🤩 Tuyệt vời</option>
              <option value="😊" selected>😊 Hài lòng</option>
              <option value="😐">😐 Bình thường</option>
              <option value="😕">😕 Cần cải thiện</option>
              <option value="🤡">🤡 Hề hước</option>
            </select>
          </label>
          <button type="submit" id="fbSubmit">📨 Gửi phản hồi</button>
        </div>
      </form>
      <div class="feedback-list">
        <h3>💬 Phản hồi gần đây (<span id="fbCount">0</span>)</h3>
        <div id="feedbackList"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>Made with 💚 in the forest 🤡🐱🌳</p>
  </footer>

  <div id="grassContainer"></div>
  <div id="gokuBurst"></div>

  <script src="script.js"></script>
</body>
    </html>
